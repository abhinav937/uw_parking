<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>UW Parking</title>
    <meta name="description" content="Real-time parking availability for UW–Madison garages and lots" />

    <!-- PWA / theme -->
    <meta name="theme-color" content="#c5050c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UW Parking" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <!-- Open connections to Mapbox before JS even parses -->
    <link rel="preconnect" href="https://api.mapbox.com" crossorigin />
    <link rel="preconnect" href="https://events.mapbox.com" crossorigin />
    <link rel="dns-prefetch" href="https://a.tiles.mapbox.com" />
    <link rel="dns-prefetch" href="https://b.tiles.mapbox.com" />
    <link rel="dns-prefetch" href="https://c.tiles.mapbox.com" />
    <link rel="dns-prefetch" href="https://d.tiles.mapbox.com" />
    <style>
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #0f1720;
        color: #d8e8f4;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      html.light-mode body {
        background: #f2ede5;
        color: #18202e;
      }
    </style>
    <script>
      (function () {
        try {
          var storedTheme = window.localStorage.getItem('uw-parking-theme');
          if (storedTheme === 'light') {
            document.documentElement.classList.add('light-mode');
          } else {
            document.documentElement.classList.remove('light-mode');
          }
        } catch (error) {
          document.documentElement.classList.remove('light-mode');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
